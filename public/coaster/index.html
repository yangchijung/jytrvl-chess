<script>
"use strict";
/* =====================================================================================================

  en: { kbd: 'Enter / Space: go   M: map   V: view', title: 'Sketch Coaster', hint: 'Draw a line with your finger or mouse<small>Let go and it becomes a roller-coaster track</small>', drawing: '{m} m', short: 'Too short — draw at least {min} m', go: 'Go!', redraw: 'Redraw', again: 'Ride again', fresh: 'Draw new', save: 'Save image', shareX: 'Share on X', copy: 'Copy link', copied: 'Link copied', shared: 'Someone drew this track. Take a ride!', mine: 'Draw my own', viewFp: 'First person', viewSide: 'Side', mini: 'Map', stop: 'Stop', done: 'Arrived!', doneSub: 'Stats for this track', len: 'Length', vmax: 'Top speed', gmax: 'Max G', air: 'Airtime', time: 'Ride time', tweet: 'I drew a roller-coaster track. Take a ride!', aria: 'Coaster canvas: draw a line with your finger or mouse', saved: 'Image saved', noGL: '3D is not available on this device, showing the side view', loopOk: '' },

function pickLang() {

}
let LANG = pickLang();
const t = (k, v) => (TEXT[LANG][k] ?? TEXT.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => (v && v[x] !== undefined ? v[x] : ''));

/* ---------------------------------------------------------------- canvases */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const glc = document.getElementById('gl');
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
let W = 0, H = 0, DPR = 1;
const $ = (id) => document.getElementById(id);

/* ---------------------------------------------------------------- state */
let mode = 'draw'; // draw | drawing | ready | ride | done | shared
let fromShare = false;
let raw = []; // drawn points (m)
let rawLen = 0;
let ctrl = null; // control points (m), 1 m apart
let track = null; // built track
let code = '';
let view = { scale: PX_PER_M, ox: 0 }; // screen x = (x - ox) * scale ; screen y = H - GROUND_PX - y * scale
let rideView = 'fp';
let showMini = true;
try { showMini = localStorage.getItem('coaster.mini') !== '0'; rideView = localStorage.getItem('coaster.view') === 'side' ? 'side' : 'fp'; } catch (e) { /* storage blocked: defaults */ }

/* =====================================================================================================
   1. Smoothing — the drawn line becomes a calm curve that keeps the size of every loop
   ===================================================================================================== */
function resample(pts, step) {
  if (pts.length < 2) return pts.slice();
  const out = [{ x: pts[0].x, y: pts[0].y }];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    if (d === 0) continue;
    let pos = step - carry;
    while (pos <= d) {
      out.push({ x: a.x + ((b.x - a.x) * pos) / d, y: a.y + ((b.y - a.y) * pos) / d });

    }
    carry = d - (pos - step);

}
function gaussian(arr, sigma) {
  const r = Math.ceil(sigma * 3), w = [];
  let sum = 0;
  for (let k = -r; k <= r; k++) { const v = Math.exp(-(k * k) / (2 * sigma * sigma)); w.push(v); sum += v; }
  const n = arr.length, out = new Float64Array(n);
  for (let i = 0; i < n; i++) {

    for (let k = -r; k <= r; k++) acc += arr[Math.min(n - 1, Math.max(0, i + k))] * w[k + r];

}
function smoothLine(points) {

  let p = resample(points, 0.25);
  if (p.length < 6) return null;
  p = p.map((_, i) => {
    let x = 0, y = 0, c = 0;
    for (let k = -2; k <= 2; k++) { const q = p[Math.min(p.length - 1, Math.max(0, i + k))]; x += q.x; y += q.y; c++; }
    return { x: x / c, y: y / c };
  });
  // 3) smooth the heading, not the coordinates: unwrap, gaussian σ = 2 m, integrate back
  const n = p.length, ang = new Float64Array(n - 1), len = new Float64Array(n - 1);
  for (let i = 0; i < n - 1; i++) {
    const dx = p[i + 1].x - p[i].x, dy = p[i + 1].y - p[i].y;
    let a = Math.atan2(dy, dx);
    if (i > 0) { while (a - ang[i - 1] > Math.PI) a -= 2 * Math.PI; while (a - ang[i - 1] < -Math.PI) a += 2 * Math.PI; }
    ang[i] = a;
    len[i] = Math.hypot(dx, dy);
  }

  const q = [{ x: p[0].x, y: p[0].y }];
  for (let i = 0; i < n - 1; i++) q.push({ x: q[i].x + Math.cos(sa[i]) * len[i], y: q[i].y + Math.sin(sa[i]) * len[i] });

  return resample(q, 1);
}

/* =====================================================================================================
   2. Share code — #t=<base64url>: int16 height of the first point (cm), then int8 dx, dy (cm) per point
   ===================================================================================================== */
function encode(cp) {
  const n = cp.length, buf = new Uint8Array(2 + (n - 1) * 2), dv = new DataView(buf.buffer);
  const h0 = Math.max(-32768, Math.min(32767, Math.round(cp[0].y * 100)));

  for (let i = 1; i < n; i++) {
    const tx = Math.round((cp[i].x - cp[0].x) * 100), ty = Math.round(cp[i].y * 100);
    const dx = Math.max(-127, Math.min(127, tx - px)), dy = Math.max(-127, Math.min(127, ty - py));
    buf[2 + (i - 1) * 2] = dx & 255;
    buf[3 + (i - 1) * 2] = dy & 255;

  }

  for (let i = 0; i < buf.length; i++) s += String.fromCharCode(buf[i]);

function decode(str) {

    for (let i = 2; i < buf.length; i += 2) {
      x += dv.getInt8(i); y += dv.getInt8(i + 1);
      out.push({ x: x / 100, y: Math.max(MIN_Y, y / 100) });
    }
    return out.length >= 10 ? out : null;
  } catch (e) { return null; }
}

/* =====================================================================================================
   3. Track geometry — Catmull-Rom through the control points, stations, tangents, curvature, seat side
   ===================================================================================================== */
function buildTrack(cp) {
  // flat straight stations of STATION metres before and after
  const d0 = Math.sign(cp[1].x - cp[0].x) || 1, d1 = Math.sign(cp[cp.length - 1].x - cp[cp.length - 2].x) || 1;
  const pts = [];

        x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * u + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * u2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * u3),
