<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css">
<style>
.row{display:flex;gap:40px;justify-content:center;padding:0 40px}
.tank{width:300px;height:300px;border-radius:40px;background:linear-gradient(#CFEFFF,#8CCBF2);box-shadow:var(--shadow);position:relative;display:flex;flex-wrap:wrap;gap:10px;padding:30px;align-content:flex-start;font-size:42px}
.slot{position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);width:110px;height:84px;border-radius:22px;border:5px dashed #fff;background:#ffffff55;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900}
.slot.fill{background:var(--sun);border-style:solid;border-color:#fff}
.cards{display:flex;justify-content:center;gap:22px;margin-top:90px}
.card{width:96px;height:96px;border-radius:24px;background:#fff;box-shadow:var(--shadow);font-size:46px;font-weight:900;display:flex;align-items:center;justify-content:center}
.card.used{opacity:.3}
.card.drag{transform:scale(1.08) translateY(-30px);box-shadow:0 18px 28px rgba(0,0,0,.25)}
</style></head><body>
<div class="top"><button class="btn">←</button><div class="pill">🐟 小魚數數 ・ 入門 2 / 5</div><div class="pill">🔊 再聽一次</div></div>
<div class="q">數一數，把數字卡拖到魚缸下面</div>
<div class="row">
 <div class="tank">🐟🐟🐟🐟🐟<div class="slot fill">5</div></div>
 <div class="tank">🐠🐠🐠🐠🐠🐠🐠🐠<div class="slot">?</div></div>
 <div class="tank">🐡🐡🐡<div class="slot">?</div></div>
</div>
<div class="cards"><div class="card">3</div><div class="card used">5</div><div class="card drag">8</div><div class="card">6</div></div>
<div class="demo">原型示意．拖曳中狀態（卡片放大、浮起）</div>
</body></html>
