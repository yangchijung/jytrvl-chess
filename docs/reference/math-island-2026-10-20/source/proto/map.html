<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css">
<style>
body{background:linear-gradient(#BFE3FF,#E8F6FF 55%,var(--sand) 56%)}
.island{position:absolute;width:300px;height:170px;border-radius:50% 50% 46% 46%;background:radial-gradient(ellipse at 50% 30%,#9EE0A8,#5CC28A 60%,#3FA36F);box-shadow:0 18px 0 #E9D3A8,0 30px 40px rgba(35,48,63,.18)}
.st{position:absolute;width:76px;height:76px;border-radius:50%;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900}
.st.done{background:var(--sun)}.st.now{background:var(--coral);color:#fff;outline:6px solid #fff8}
.st.lock{background:#e7e1d5;color:#b4ab9b}
.lab{position:absolute;font-weight:800;font-size:18px;background:#fff;border-radius:12px;padding:4px 12px;box-shadow:var(--shadow);white-space:nowrap}
.otter{position:absolute;left:520px;top:300px;font-size:64px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.1))}
.path{position:absolute;left:0;top:0}
</style></head><body>
<div class="top"><div class="pill">🏝️ 一年級島</div><div class="pill">⭐ 23</div><button class="btn">⚙︎</button></div>
<div class="island" style="left:80px;top:250px"></div><div class="island" style="left:440px;top:380px;transform:scale(1.15)"></div><div class="island" style="left:820px;top:240px"></div>
<svg class="path" width="1180" height="820"><path d="M190 330 C 300 520, 420 560, 590 470 S 860 300, 950 320" stroke="#fff" stroke-width="10" stroke-dasharray="2 22" stroke-linecap="round" fill="none"/></svg>
<div class="st done" style="left:152px;top:292px">1</div><div class="lab" style="left:120px;top:380px">小魚數數 ⭐⭐⭐</div>
<div class="st done" style="left:330px;top:470px">2</div><div class="lab" style="left:300px;top:556px">排排站 ⭐⭐</div>
<div class="st now" style="left:552px;top:430px">3</div><div class="lab" style="left:530px;top:516px">蘋果籃</div>
<div class="otter">🦦</div>
<div class="st lock" style="left:740px;top:340px">🔒</div><div class="lab" style="left:712px;top:426px">時鐘小鎮</div>
<div class="st lock" style="left:912px;top:282px">🔒</div><div class="lab" style="left:886px;top:368px">糖果店</div>
<div style="position:absolute;right:28px;bottom:40px" class="pill">今日任務 2 / 3 ・ 約 6 分鐘</div>
<div class="demo">原型示意．角色與圖示為暫代，正式版換成原創插畫</div>
</body></html>
