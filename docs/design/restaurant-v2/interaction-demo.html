<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>餐廳當老闆 V2 互動設計</title><style>body{margin:0;padding:16px;background:#e9e1ce;font-family:system-ui,sans-serif}main{max-width:1024px;margin:auto}.design-note{color:#3e4636;font-size:14px;margin:0 0 12px}button{cursor:pointer}</style><main><p class="design-note">互動設計參考 · 尚未替換正式遊戲 · 重新整理會重玩</p>
<div id="jy-restaurant-scene" aria-label="餐廳當老闆動態設計樣稿">
  <style>
    #jy-restaurant-scene{--jr-ink:#3e4636;--jr-paper:light-dark(#fff5de,#353d34);--jr-text:light-dark(#3e4636,#fff2d5);--jr-green:#426e54;--jr-gold:#f1c568;--jr-line:light-dark(#e4cfaa,#63705b);color:var(--jr-text);font-family:"Noto Sans TC",system-ui,sans-serif;color-scheme:light dark}
    #jy-restaurant-scene *{box-sizing:border-box}
    #jy-restaurant-scene .game{overflow:hidden;border-radius:25px;background:var(--jr-paper);box-shadow:0 12px 35px #4e3c261a}
    #jy-restaurant-scene button{font:inherit;color:inherit;border:0;border-radius:16px;min-height:48px;padding:8px 15px;background:transparent;touch-action:manipulation}
    #jy-restaurant-scene button:disabled{opacity:.45;cursor:default}
    #jy-restaurant-scene button:focus-visible{outline:3px solid #dd8e38;outline-offset:3px}
    #jy-restaurant-scene .top{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;gap:12px}
    #jy-restaurant-scene .brand{font-size:20px;font-weight:800;letter-spacing:.02em}
    #jy-restaurant-scene .wallet{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
    #jy-restaurant-scene .wallet img{width:32px;height:32px}
    #jy-restaurant-scene .top-actions{display:flex;align-items:center;gap:5px}
    #jy-restaurant-scene .top-actions button{border:1px solid var(--jr-line);font-size:16px}
    #jy-restaurant-scene .stage{position:relative;aspect-ratio:1280/760;isolation:isolate;overflow:hidden;background:#efc994}
    #jy-restaurant-scene .backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
    #jy-restaurant-scene .chef{position:absolute;left:37%;top:13%;width:17%;height:37%;object-fit:contain;object-position:top;clip-path:inset(0 0 23% 0);transform-origin:50% 65%;filter:drop-shadow(0 6px 1px #81613c0a)}
    #jy-restaurant-scene .guest{position:absolute;left:57%;top:55%;width:16%;height:40%;object-fit:contain;transform-origin:bottom;transition:opacity .3s,transform .3s}
    #jy-restaurant-scene .friend{position:absolute;left:35%;top:64%;width:12%;height:30%;object-fit:contain;opacity:.7}
    #jy-restaurant-scene .bubble{position:absolute;left:65%;top:49%;width:98px;min-height:76px;border-radius:24px 24px 24px 5px;background:#fffaf0;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 #c9ab7c55;transition:opacity .25s}
    #jy-restaurant-scene .bubble img{width:80px;height:64px;object-fit:contain}
    #jy-restaurant-scene .dish-on-counter{position:absolute;left:52%;top:33%;width:13%;height:16%;object-fit:contain;transform-origin:bottom;opacity:0;transition:opacity .2s}
    #jy-restaurant-scene .plant-scene{position:absolute;left:15%;top:49%;width:7%;height:15%;object-fit:contain;opacity:0;transform:scale(.3);transition:transform .5s,opacity .5s}
    #jy-restaurant-scene .plant-scene.bought{opacity:1;transform:scale(1)}
    #jy-restaurant-scene .instruction{position:absolute;left:50%;top:4%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap;background:#fff7e9;color:#4f5941;border-radius:24px;padding:8px 12px 8px 22px;box-shadow:0 5px 0 #bc955833;font-size:22px;font-weight:800;max-width:94%}
    #jy-restaurant-scene .instruction button{color:#4f5941;min-width:44px;padding:8px;background:#f4e4c8;border-radius:50%;font-size:14px}
    #jy-restaurant-scene .progress{position:absolute;left:4%;top:4%;display:flex;gap:6px;background:#fff9e6d9;border-radius:16px;padding:10px}
    #jy-restaurant-scene .progress span{width:10px;height:10px;border-radius:50%;background:#d0bea0}
    #jy-restaurant-scene .progress .filled{background:#5e916c}
    #jy-restaurant-scene .hint-tray{position:absolute;left:4%;bottom:6%;display:flex;align-items:center;gap:8px;background:#fff9e8f2;border-radius:19px;padding:10px 12px;color:#4b5945;box-shadow:0 6px 0 #a97b4933}
    #jy-restaurant-scene .hint-tray img{width:44px;height:44px;object-fit:contain}
    #jy-restaurant-scene .hint-tray span{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
    #jy-restaurant-scene .steam{position:absolute;left:34%;top:26%;display:flex;gap:11px;opacity:0;pointer-events:none}
    #jy-restaurant-scene .steam i{height:40px;width:9px;border-radius:50%;background:#fff5dfb3;transform:rotate(14deg)}
    #jy-restaurant-scene .steam i:nth-child(2){height:53px}
    #jy-restaurant-scene .stage.cooking .chef{animation:jr-cook .22s ease-in-out 4}
    #jy-restaurant-scene .stage.cooking .steam{animation:jr-steam .8s ease-out}
    #jy-restaurant-scene .stage.arriving .guest{animation:jr-arrive .55s ease-out}
    #jy-restaurant-scene .stage.serving .dish-on-counter{animation:jr-serve .6s ease-in-out}
    #jy-restaurant-scene .stage.serving .guest{animation:jr-cheer .3s ease-in-out 2}
    #jy-restaurant-scene .coins-float{position:absolute;left:65%;top:44%;opacity:0;color:#715021;font-size:26px;font-weight:900;text-shadow:0 2px #ffedb4;pointer-events:none}
    #jy-restaurant-scene .stage.serving .coins-float{animation:jr-coins .75s ease-out}
    #jy-restaurant-scene .delivery{position:absolute;left:-30%;bottom:12%;display:flex;align-items:center;gap:3px;padding:9px 15px;background:#e6b478;border-radius:16px;border-bottom:8px solid #6b7253;opacity:0;pointer-events:none}
    #jy-restaurant-scene .delivery img{width:48px;height:48px}
    #jy-restaurant-scene .stage.delivering .delivery{animation:jr-deliver .85s ease-in-out}
    #jy-restaurant-scene .stage.paused:after{content:'休息一下';position:absolute;inset:0;display:grid;place-items:center;background:#23372799;color:#fff8e7;font-size:30px;font-weight:800}
    #jy-restaurant-scene .stage.paused *{animation-play-state:paused!important}
    #jy-restaurant-scene .dock{padding:16px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center}
    #jy-restaurant-scene .choices{display:flex;gap:12px;min-width:0;align-items:stretch;flex-wrap:wrap}
    #jy-restaurant-scene .food-card{width:calc((100% - 24px)/3);max-width:192px;min-width:130px;display:flex;flex-direction:column;align-items:center;border-radius:20px;border:2px solid var(--jr-line);padding:5px;background:light-dark(#fffaf0,#444c40);position:relative}
    #jy-restaurant-scene .food-card.selected{border-color:#73966e;background:light-dark(#eef1d9,#40513d)}
    #jy-restaurant-scene .food-card .pick{width:100%;display:flex;flex-direction:column;align-items:center;padding:0 4px;gap:0;min-height:96px}
    #jy-restaurant-scene .food-card .pick img{width:98px;height:70px;object-fit:contain}
    #jy-restaurant-scene .food-card .name{font-size:16px;font-weight:700;line-height:1.4;text-align:center}
    #jy-restaurant-scene .food-card .badge{position:absolute;right:8px;top:8px;background:#52744c;color:#fff8e7;padding:2px 6px;border-radius:20px;font-size:14px;pointer-events:none}
    #jy-restaurant-scene .qty{display:flex;align-items:center;justify-content:center;gap:3px;width:100%;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
    #jy-restaurant-scene .qty button{width:44px;padding:5px;min-height:44px;background:light-dark(#eadfc4,#5b6651);border-radius:13px;font-size:23px}
    #jy-restaurant-scene .qty output{min-width:22px;text-align:center}
    #jy-restaurant-scene .food-card .small-status{font-size:14px;min-height:25px;line-height:1.4}
    #jy-restaurant-scene .buy-item{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;flex:1;font-size:15px;font-weight:700}
    #jy-restaurant-scene .buy-item img{width:53px;height:53px;background:light-dark(#f2e7ca,#505a44);border-radius:14px}
    #jy-restaurant-scene .buy-item.shared img{box-shadow:0 0 0 3px #93ae78}
    #jy-restaurant-scene .main-action{display:flex;flex-direction:column;align-items:stretch;gap:9px;min-width:155px}
    #jy-restaurant-scene .main-action button.primary{background:#527750;color:#fff9e8;box-shadow:0 5px 0 #375335;min-height:60px;font-size:20px;font-weight:800;padding:10px 24px}
    #jy-restaurant-scene .main-action button.secondary{border:1px solid var(--jr-line);font-size:15px;min-height:44px}
    #jy-restaurant-scene .micro{font-size:14px;line-height:1.5;margin:0;grid-column:1/-1;min-height:21px;color:var(--jr-text)}
    #jy-restaurant-scene .result-chips{display:flex;gap:10px;flex-wrap:wrap;font-size:18px;font-weight:700}
    #jy-restaurant-scene .result-chips span{background:light-dark(#e5edd4,#43503b);padding:14px 18px;border-radius:16px}
    #jy-restaurant-scene .book{margin:0 20px 20px;padding:20px;background:light-dark(#fffdf4,#444c40);border:1px solid var(--jr-line);border-radius:20px;font-size:16px;line-height:1.6}
    #jy-restaurant-scene .book dl{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:10px 0}
    #jy-restaurant-scene .book dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
    #jy-restaurant-scene .book h3{margin:0 0 8px;font:800 20px/1.4 "Noto Sans TC",system-ui,sans-serif}
    #jy-restaurant-scene .book p{margin:6px 0}
    #jy-restaurant-scene .book .close-book{border:1px solid var(--jr-line);margin-top:10px}
    #jy-restaurant-scene .sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    #jy-restaurant-scene [hidden]{display:none!important}
    @keyframes jr-cook{0%,100%{transform:rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
    @keyframes jr-steam{0%{opacity:0;transform:translateY(16px)}40%{opacity:1}100%{opacity:0;transform:translateY(-18px)}}
    @keyframes jr-arrive{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:translateX(0)}}
    @keyframes jr-cheer{50%{transform:translateY(-9px) rotate(-3deg)}}
    @keyframes jr-coins{10%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
    @keyframes jr-serve{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(45px,100px) scale(.7)}}
    @keyframes jr-deliver{0%{left:-30%;opacity:1}55%{left:31%;opacity:1}100%{left:70%;opacity:0}}
    @media(max-width:650px){#jy-restaurant-scene .top{padding:10px 12px;gap:5px;flex-wrap:wrap}#jy-restaurant-scene .brand{font-size:18px}#jy-restaurant-scene .wallet{font-size:22px}#jy-restaurant-scene .top-actions{margin-left:auto}#jy-restaurant-scene .stage{aspect-ratio:1/1.04}#jy-restaurant-scene .backdrop{object-position:49% center}#jy-restaurant-scene .chef{left:32%;top:12%;width:29%;height:40%}#jy-restaurant-scene .guest{left:56%;top:55%;width:25%;height:39%}#jy-restaurant-scene .friend{left:18%;top:65%;width:20%;height:28%}#jy-restaurant-scene .bubble{left:70%;top:45%;width:75px;min-height:64px}#jy-restaurant-scene .bubble img{width:65px;height:52px}#jy-restaurant-scene .dish-on-counter{left:58%;top:34%;width:21%;height:16%}#jy-restaurant-scene .instruction{top:4%;font-size:19px;padding:5px 7px 5px 14px;gap:5px}#jy-restaurant-scene .progress{top:auto;bottom:5%;left:auto;right:4%;gap:4px;padding:9px}#jy-restaurant-scene .progress span{width:8px;height:8px}#jy-restaurant-scene .hint-tray{bottom:5%;padding:5px 9px;gap:4px;left:4%}#jy-restaurant-scene .hint-tray img{width:31px;height:31px}#jy-restaurant-scene .hint-tray span{font-size:16px}#jy-restaurant-scene .plant-scene{left:5%;top:48%;width:12%;height:17%}#jy-restaurant-scene .dock{padding:12px;grid-template-columns:1fr;gap:12px}#jy-restaurant-scene .choices{gap:8px;justify-content:center}#jy-restaurant-scene .food-card{min-width:0;flex:1;width:calc((100% - 16px)/3);padding:4px}#jy-restaurant-scene .food-card .pick img{width:80px;max-width:100%;height:60px}#jy-restaurant-scene .food-card .name{font-size:14px}#jy-restaurant-scene .food-card .badge{right:2px;top:2px}#jy-restaurant-scene .qty{gap:0}#jy-restaurant-scene .qty button{min-width:36px;width:36px;font-size:22px}#jy-restaurant-scene .main-action{flex-direction:row;min-width:0}#jy-restaurant-scene .main-action .primary{flex:1;padding:8px 14px;min-height:54px}#jy-restaurant-scene .main-action .secondary{padding:8px 14px}#jy-restaurant-scene .buy-item{flex:0 0 calc((100% - 32px)/5);min-width:44px;font-size:14px}#jy-restaurant-scene .buy-item img{width:44px;height:44px}#jy-restaurant-scene .result-chips{font-size:16px;justify-content:center}#jy-restaurant-scene .result-chips span{padding:10px 13px}#jy-restaurant-scene .book{margin:0 12px 12px;padding:15px}#jy-restaurant-scene .steam{left:24%;top:28%}#jy-restaurant-scene .micro{text-align:center}}
    #jy-restaurant-scene .bubble.queue{width:180px;left:62%;gap:3px;padding:7px}
    #jy-restaurant-scene .bubble.queue img{width:52px;height:48px}
    #jy-restaurant-scene .qty button{min-width:44px;width:44px}
    #jy-restaurant-scene .bubble.alternatives{width:145px;left:61%;padding:5px;color:#4b5945;font-size:13px}
    #jy-restaurant-scene .bubble.alternatives img{width:58px;height:55px}
    #jy-restaurant-scene .no-motion *{animation:none!important;transition:none!important}
    @media(max-width:650px){#jy-restaurant-scene .bubble.alternatives{left:58%;width:38%}#jy-restaurant-scene .bubble.alternatives img{width:42%;height:48px}#jy-restaurant-scene .bubble.queue{left:58%;width:38%;gap:0;padding:4px}#jy-restaurant-scene .bubble.queue img{width:33%;height:44px}#jy-restaurant-scene .food-card{min-width:112px}#jy-restaurant-scene .qty output{min-width:18px}}
    @media(max-width:385px){#jy-restaurant-scene .food-card{flex:0 1 calc((100% - 8px)/2);width:calc((100% - 8px)/2);max-width:none}}
    @media(prefers-reduced-motion:reduce){#jy-restaurant-scene *{animation:none!important;transition:none!important}}
  </style>
  <div class="game">
    <header class="top"><strong class="brand">餐廳當老闆</strong><div class="wallet"><img data-art="coin" alt="金幣"><span id="jr-cash">500</span></div><div class="top-actions"><button id="jr-book-toggle" type="button" class="cursor-interaction" aria-expanded="false">小帳本</button><button id="jr-pause" type="button" class="cursor-interaction">暫停</button></div></header>
    <div class="stage" id="jr-stage" role="group" aria-label="餐廳場景">
      <img class="backdrop" data-art="restaurant-background" alt="溫暖的小餐廳，有料理台、桌椅與大窗戶">
      <img class="chef" data-art="chef" alt="小熊主廚">
      <img class="guest" id="jr-guest" data-art="bunny" alt="正在等餐的客人">
      <img class="friend" data-art="fox" alt="" aria-hidden="true">
      <div class="bubble" id="jr-order-bubble"><img id="jr-order-img" data-art="dish-tomato" alt="想吃番茄蛋飯"></div>
      <img class="dish-on-counter" id="jr-ready-art" data-art="dish-tomato" alt="">
      <img class="plant-scene" id="jr-plant" data-art="plant" alt="">
      <div class="instruction"><span id="jr-prompt">選今天的菜</span><button type="button" id="jr-speak" class="cursor-interaction" aria-label="聽目前提示">聽</button></div>
      <div class="progress" id="jr-progress" aria-label="已服務 0 位客人，共 6 位"></div>
      <div class="hint-tray" id="jr-stock-peek" aria-label="共用食材"><img data-art="rice" alt="米"><span id="jr-rice-count">6</span><img data-art="egg" alt="蛋"><span id="jr-egg-count">6</span></div>
      <div class="steam" aria-hidden="true"><i></i><i></i><i></i></div><div class="coins-float" id="jr-coins-float" aria-hidden="true">+32</div>
      <div class="delivery" aria-hidden="true"><img data-art="rice" alt=""><img data-art="egg" alt=""><img data-art="tomato" alt=""></div>
    </div>
    <div class="dock"><div class="choices" id="jr-choices"></div><div class="main-action"><button id="jr-primary" class="primary cursor-interaction" type="button">去買菜</button><button id="jr-secondary" class="secondary cursor-interaction" type="button" hidden>回菜單</button></div><p class="micro" id="jr-feedback" aria-live="polite">米和蛋，兩道菜一起用。</p></div>
    <section class="book" id="jr-book" aria-label="可選的小帳本" hidden></section>
    <p class="sr" id="jr-live" aria-live="polite"></p>

    const food=[{id:'a',name:'番茄蛋飯',art:'dish-tomato',price:32,cost:19,recipe:{rice:1,egg:1,tomato:1,packaging:1}},{id:'b',name:'蔬菜蛋炒飯',art:'dish-vegetable',price:35,cost:20,recipe:{rice:1,egg:1,vegetable:1,packaging:1}},{id:'c',name:'起司蛋吐司',art:'dish-toast',price:30,cost:21,recipe:{bread:1,egg:1,cheese:1,packaging:1}}];
    const guests=[['a','c'],['b','c'],['a'],['b','c'],['a','c'],['b']];
    const empty=()=>Object.fromEntries(Object.keys(items).map(k=>[k,0]));
    const fresh=()=>({v:2,phase:'menu',plan:{a:3,b:3,c:0},stock:empty(),ready:{a:0,b:0,c:0},cash:500,batch:1,made:0,madeBatch:0,guest:0,sold:0,revenue:0,cogs:0,purchases:0,result:null,plant:false});
    let s=fresh(), paused=false,busy=false,bookOpen=false,timer=null,animationGuest=null,feedback='米和蛋，兩道菜一起用。';
    const prefs={motion:true};
    const restore=data=>{const x=data?.privateContent?.restaurant;if(x?.v===2&&['menu','buy','prep','serve','closed','done'].includes(x.phase)&&Number.isFinite(x.cash)&&x.plan&&x.stock&&x.ready&&Number.isInteger(x.guest)&&x.guest>=0&&x.guest<=6){s=x;return true}return false};

    const persist=()=>{};
    const req=()=>{const r=empty();food.forEach(f=>Object.entries(f.recipe).forEach(([i,n])=>r[i]+=n*s.plan[f.id]));return r};
    const buy=()=>{const n=req(),qty={},units=empty();let total=0;for(const k in items){qty[k]=Math.ceil(Math.max(0,n[k]-s.stock[k])/items[k][0]);units[k]=qty[k]*items[k][0];total+=qty[k]*items[k][1]}return{n,qty,units,total}};
    const selected=()=>food.filter(f=>s.plan[f.id]>0);
    const allowed=f=>s.phase==='prep'&&s.made<8&&s.madeBatch<4&&Object.entries(f.recipe).every(([k,n])=>s.stock[k]>=n);
    const suitable=f=>s.phase==='serve'&&s.ready[f.id]>0&&guests[s.guest]?.includes(f.id);
    const button=(text,act,opts={})=>{const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.textContent=text;b.disabled=!!opts.disabled;b.onclick=act;if(opts.label)b.setAttribute('aria-label',opts.label);return b};
    function animate(kind,after){busy=true;render();const stage=$('jr-stage');stage.classList.remove('cooking','serving','delivering','arriving');void stage.offsetWidth;stage.classList.add(kind);const time=prefs.motion&&!matchMedia('(prefers-reduced-motion: reduce)').matches?850:0;timer=setTimeout(()=>{stage.classList.remove(kind);busy=false;animationGuest=null;after?.();render();},time)}
    function saveAndRender(){persist();render()}
    function planChange(id,n){if(paused||busy)return;s.plan[id]=Math.max(0,Math.min(8,n));feedback='米和蛋，兩道菜一起用。';saveAndRender()}
    function cook(f){if(paused||busy||!allowed(f))return;for(const[k,n]of Object.entries(f.recipe))s.stock[k]-=n;s.ready[f.id]++;s.made++;s.madeBatch++;$('jr-ready-art').src=A[f.art];$('jr-ready-art').style.opacity='1';feedback='做好了！原料留給下一批。';persist();animate('cooking')}
    function nextGuest(){s.guest++;if(s.guest===3){s.phase='prep';s.batch=2;s.madeBatch=0;feedback='再準備三位客人的餐。'}else if(s.guest===6){const wc=food.reduce((sum,f)=>sum+s.ready[f.id]*f.cost,0),wr=s.stock.vegetable*4;s.stock.vegetable=0;s.ready={a:0,b:0,c:0};s.cash-=50;s.result={revenue:s.revenue,cogs:s.cogs,waste:wc+wr,fixed:50,profit:s.revenue-s.cogs-wc-wr-50,cash:s.cash,stock:Object.keys(items).reduce((v,k)=>v+s.stock[k]*items[k][2],0)};s.phase='closed';feedback='裝飾小店，或把金幣留下。';}else feedback='下一位客人來了。';persist()}
    function serve(f){if(paused||busy||!suitable(f))return;animationGuest=s.guest;s.ready[f.id]--;s.cash+=f.price;s.revenue+=f.price;s.cogs+=f.cost;s.sold++;$('jr-ready-art').src=A[f.art];$('jr-ready-art').style.opacity='1';$('jr-coins-float').textContent='+'+f.price;nextGuest();animate('serving')}
    function noSale(){if(paused||busy||selected().some(suitable))return;feedback='這次沒賣到，下次換個計畫。';nextGuest();saveAndRender()}
    function primary(){if(paused||busy)return;if(s.phase==='menu'){if(!selected().length)return;const count=Object.values(s.plan).reduce((a,b)=>a+b,0);if(count>8){feedback='一天最多做 8 份，少選一些。';render();return}s.phase='buy';feedback='先一起算，再整包買。';saveAndRender()}
      else if(s.phase==='buy'){const b=buy();if(b.total>s.cash-50){feedback='金幣不夠，先少賣幾份。';render();return}s.cash-=b.total;s.purchases+=b.total;for(const k in items)s.stock[k]+=b.units[k];s.phase='prep';feedback='看餐點圖卡，點一下做一份。';persist();animate('delivering')}
      else if(s.phase==='prep'){s.phase='serve';feedback='點餐盤，把餐送給客人。';saveAndRender();$('jr-stage').classList.add('arriving')}
      else if(s.phase==='serve'){if(!selected().some(suitable))noSale()}
      else if(s.phase==='closed'){if(s.cash<120)return;s.cash-=120;s.plant=true;s.phase='done';feedback='小店多了一盆綠意！';saveAndRender()}
      else if(s.phase==='done'){s=fresh();feedback='換一個菜單，再試一天。';saveAndRender()}}
    function secondary(){if(paused||busy)return;if(s.phase==='buy'){s.phase='menu';feedback='換菜單也可以。';saveAndRender()}else if(s.phase==='closed'){s.phase='done';feedback='金幣留給下一次採買。';saveAndRender()}}
    function renderBook(){const el=$('jr-book');el.hidden=!bookOpen;$('jr-book-toggle').setAttribute('aria-expanded',String(bookOpen));if(!bookOpen)return;let html='<h3>小帳本</h3>';
      if(s.result){const r=s.result;html+='<dl><dt>賣餐收到</dt><dd>'+r.revenue+'</dd><dt>賣出餐點成本</dt><dd>−'+r.cogs+'</dd><dt>沒賣完與到期報廢</dt><dd>−'+r.waste+'</dd><dt>固定費用</dt><dd>−50</dd><dt>今天結餘</dt><dd>'+r.profit+'</dd><dt>打烊現金</dt><dd>'+r.cash+'</dd><dt>裝飾花費</dt><dd>'+(s.plant?'−120':'0')+'</dd><dt>手上金幣</dt><dd>'+s.cash+'</dd><dt>可用存貨成本</dt><dd>'+r.stock+'</dd></dl><p>留下的原料仍是存貨；買盆栽不會改掉今天的營業結餘。</p>'}
      else if(['menu','buy'].includes(s.phase)){const b=buy();html+='<dl>';for(const k in items)if(b.n[k]||s.stock[k])html+='<dt>'+names[k]+'：計畫 '+b.n[k]+'／庫存 '+s.stock[k]+'</dt><dd>'+b.qty[k]+' 包 × '+items[k][1]+'</dd>';html+='</dl><p>每包數量：米 6、蛋 6、番茄 3、青菜 3、吐司 4、起司 4、餐盒 1。</p><p>共用原料一起算，不會自動打折。售價固定；成本含包裝。</p>'}
      else{html+='<dl><dt>目前收入</dt><dd>'+s.revenue+'</dd><dt>已採買</dt><dd>'+s.purchases+'</dd>';for(const k in items)html+='<dt>'+names[k]+'庫存</dt><dd>'+s.stock[k]+'</dd>';html+='</dl><p>採買時已付金幣；做菜只取用原料，不會再扣一次。</p>'}el.innerHTML=html;const close=button('收起來',()=>{bookOpen=false;renderBook()});close.className+=' close-book';el.append(close);}
    function render(){
      $('jr-cash').textContent=s.cash;root.querySelector('.game').classList.toggle('no-motion',!prefs.motion);$('jr-stage').classList.toggle('paused',paused);$('jr-pause').textContent=paused?'繼續':'暫停';$('jr-feedback').textContent=feedback;$('jr-live').textContent=feedback;
      const prompt={menu:'選今天的菜',buy:'共用食材一起買',prep:s.batch===1?'點餐點，做一份':'再做下一批',serve:'點餐盤，上菜',closed:'今天辛苦了',done:'小店的一天完成'}[s.phase];$('jr-prompt').textContent=prompt;
      const progress=$('jr-progress');progress.innerHTML='';for(let i=0;i<6;i++){const dot=document.createElement('span');if(i<s.guest)dot.className='filled';progress.append(dot)}progress.setAttribute('aria-label','已處理 '+s.guest+' 位客人，共 6 位');
      const g=Math.min(animationGuest??s.guest,5),current=food.find(f=>f.id===guests[g][0]),bubble=$('jr-order-bubble');const queue=s.phase==='prep'&&animationGuest===null;bubble.classList.toggle('queue',queue);const wishes=queue?guests.slice(s.batch===1?0:3,s.batch===1?3:6).map(order=>food.find(f=>f.id===order[0])):guests[g].map(id=>food.find(f=>f.id===id));bubble.classList.toggle('alternatives',!queue&&wishes.length>1);bubble.innerHTML=wishes.map(f=>'<img src="'+A[f.art]+'" alt="想吃'+f.name+'">').join(queue?'':'<span aria-hidden="true">或</span>');$('jr-guest').src=A[g%2?'fox':'bunny'];$('jr-order-bubble').hidden=animationGuest===null&&['menu','buy','closed','done'].includes(s.phase);$('jr-guest').style.opacity=['closed','done'].includes(s.phase)?'.3':'1';$('jr-plant').classList.toggle('bought',s.plant);$('jr-plant').alt=s.plant?'新買的盆栽':'';
      const n=req(),look=['menu','buy'].includes(s.phase)?n:s.stock;$('jr-rice-count').textContent=look.rice;$('jr-egg-count').textContent=look.egg;$('jr-stock-peek').setAttribute('aria-label',(['menu','buy'].includes(s.phase)?'計畫需要':'共用庫存')+'米 '+look.rice+' 份，蛋 '+look.egg+' 顆');
      const ready=food.find(f=>s.ready[f.id]>0);if(!busy){$('jr-ready-art').style.opacity=ready?'1':'0';if(ready)$('jr-ready-art').src=A[ready.art]}
      const choices=$('jr-choices');choices.innerHTML='';
      if(['menu','prep','serve'].includes(s.phase))for(const f of s.phase==='menu'?food:selected()){
        const card=document.createElement('div');card.className='food-card'+(s.plan[f.id]>0?' selected':'');
        const pick=button('',()=>{if(s.phase==='menu')planChange(f.id,s.plan[f.id]?0:1);else if(s.phase==='prep')cook(f);else serve(f)},{disabled:paused||busy||(s.phase==='prep'&&!allowed(f))||(s.phase==='serve'&&!suitable(f)),label:s.phase==='menu'?'選擇'+f.name:s.phase==='prep'?'做一份'+f.name:'上菜：'+f.name});pick.className+=' pick';if(s.phase==='menu')pick.setAttribute('aria-pressed',String(s.plan[f.id]>0));pick.innerHTML='<img src="'+A[f.art]+'" alt=""><span class="name">'+f.name+'</span>';card.append(pick);
        if(s.phase==='menu'&&s.plan[f.id]){const mark=document.createElement('span');mark.className='badge';mark.textContent='✓';card.append(mark);const qty=document.createElement('div');qty.className='qty';qty.setAttribute('role','group');qty.setAttribute('aria-label',f.name+'預計份數');qty.append(button('−',()=>planChange(f.id,s.plan[f.id]-1),{label:'少做一份'+f.name,disabled:paused||busy}));const out=document.createElement('output');out.textContent=s.plan[f.id];qty.append(out);qty.append(button('+',()=>planChange(f.id,s.plan[f.id]+1),{label:'多做一份'+f.name,disabled:paused||busy||s.plan[f.id]>=8}));card.append(qty)}
        else if(s.phase!=='menu'){const line=document.createElement('span');line.className='small-status';line.textContent='已做好 '+s.ready[f.id]+' 份';card.append(line)}choices.append(card);
      }
      if(s.phase==='buy'){const b=buy();for(const k in items)if(b.units[k]){const el=document.createElement('div');el.className='buy-item'+(['rice','egg'].includes(k)?' shared':'');el.innerHTML='<img src="'+A[k]+'" alt="'+names[k]+'"><span>'+names[k]+'</span><span>× '+b.units[k]+'</span>';choices.append(el)}}
      if(['closed','done'].includes(s.phase)){const chips=document.createElement('div');chips.className='result-chips';chips.innerHTML='<span>服務 '+s.sold+' 位</span><span>今天結餘 '+(s.result.profit>0?'+':'')+s.result.profit+'</span>';choices.append(chips)}
      const primaryBtn=$('jr-primary'),secondaryBtn=$('jr-secondary');primaryBtn.textContent={menu:'去買菜',buy:'買齊 '+buy().total,prep:Object.values(s.ready).some(n=>n>0)?'開始上菜':'這批先不做',serve:'今天沒有',closed:'買盆栽 120',done:'再玩一天'}[s.phase];primaryBtn.hidden=s.phase==='serve'&&selected().some(suitable);primaryBtn.disabled=paused||busy||(s.phase==='menu'&&(!selected().length||Object.values(s.plan).reduce((a,b)=>a+b,0)>8))||(s.phase==='closed'&&s.cash<120)||(s.phase==='buy'&&buy().total>s.cash-50);secondaryBtn.hidden=!['buy','closed'].includes(s.phase);secondaryBtn.textContent=s.phase==='buy'?'回菜單':'存起來';secondaryBtn.disabled=paused||busy;
      if(s.phase==='menu'&&Object.values(s.plan).reduce((a,b)=>a+b,0)>8)$('jr-feedback').textContent='一天最多做 8 份，少選一些。';
      if(s.phase==='prep'&&s.madeBatch>=4)$('jr-feedback').textContent='這批做滿了，可以上菜囉。';
      if(s.phase==='serve'&&!selected().some(suitable))$('jr-feedback').textContent='沒有客人要的餐，下次調整。';
      renderBook();
    }
    $('jr-primary').onclick=primary;$('jr-secondary').onclick=secondary;
    $('jr-book-toggle').onclick=()=>{bookOpen=!bookOpen;renderBook()};$('jr-pause').onclick=()=>{paused=!paused;render()};
    $('jr-speak').onclick=()=>{const text=$('jr-prompt').textContent;if('speechSynthesis'in window&&'SpeechSynthesisUtterance'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}else{feedback=text;render()}};
    arts();render();


  })();
  </script>
